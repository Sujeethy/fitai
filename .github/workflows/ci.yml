name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Catches schema files and generated migrations drifting apart, which
      # otherwise surfaces as a confusing runtime failure on a real device.
      - name: Migrations match schema
        run: pnpm db:check

      # EAS runs this during a build, which is a slow and expensive place to
      # first learn that a config is wrong. Running it here surfaces the same
      # problems in a minute instead of twenty.
      #
      # apps/mobile/package.json's expo.install.exclude deliberately keeps
      # @sentry/react-native and @shopify/flash-list off this check's version
      # comparison — both are already pinned to their own latest release, ahead
      # of what Expo SDK 57's bundled compatibility table currently lists. See
      # CLAUDE.md, "Don't add dependencies casually".
      - name: Expo doctor
        working-directory: apps/mobile
        run: npx -y expo-doctor
