name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Catches schema files and generated migrations drifting apart, which
      # otherwise surfaces as a confusing runtime failure on a real device.
      - name: Migrations match schema
        run: pnpm db:check

      # The production Metro bundle, which is what `:app:createBundleReleaseJsAndAssets`
      # produces inside a real build. A bad import, a missing Babel transform, or a
      # module that only resolves in dev fails here in a minute or two rather than
      # ten minutes into a Gradle run. This is the cheap half of the build check —
      # the full native one lives in build.yml and runs before EAS is called.
      #
      # Ahead of expo-doctor deliberately. Doctor reports version drift, which is
      # advisory and goes stale on its own as Expo publishes patches; this step
      # reports whether the app can actually be built. When both are failing, the
      # second is the one worth seeing, and a failed step stops the job.
      - name: Bundle for release
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir /tmp/fitai-bundle-check

      # EAS runs this during a build, which is a slow and expensive place to
      # first learn that a config is wrong. Running it here surfaces the same
      # problems in a minute instead of twenty.
      #
      # apps/mobile/package.json's expo.install.exclude deliberately keeps
      # @sentry/react-native, @shopify/flash-list, and react-native-gesture-handler
      # off this check's version comparison — all three are already pinned ahead
      # of what Expo SDK 57's bundled compatibility table currently lists.
      # gesture-handler 3.2.1 specifically is what expo-router 57.0.13 itself
      # already pulls in transitively (its drawer layout requires it) — pinning
      # it explicitly just makes an existing transitive resolution visible, not
      # a new version choice. See CLAUDE.md, "Don't add dependencies casually".
      - name: Expo doctor
        working-directory: apps/mobile
        run: npx -y expo-doctor
