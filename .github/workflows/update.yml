name: Publish OTA update

# JavaScript-only changes reach the installed app without a rebuild.
# Native changes do NOT — those need the build workflow. See docs/DEPLOYMENT.md.
on:
  push:
    branches: [main]

jobs:
  update:
    name: eas update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: pnpm install --frozen-lockfile

      # Do not publish something that does not compile.
      - run: pnpm typecheck

      - name: Publish
        working-directory: apps/mobile
        run: eas update --branch preview --message "${{ github.event.head_commit.message }}" --non-interactive
